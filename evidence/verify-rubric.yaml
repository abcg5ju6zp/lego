rubrics:
  - id: 1
    type: f2p
    text: "证书链、私钥、OCSP 和元数据在候选确认前不会混合暴露。"
  - id: 2
    type: f2p
    text: "全部文件校验、权限设置和同步成功后才一次切换当前证书代际。"
  - id: 3
    type: f2p
    text: "保存、hook、权限或进程退出失败时旧证书仍可被服务读取。"
  - id: 4
    type: f2p
    text: "重启会继续未确认代际或清理候选，不会把半写证书当成最新版本。"
  - id: 5
    type: f2p
    text: "相同 certID 的并发续期和 ACME 重试只产生一个可见版本，不重复部署。"
  - id: 6
    type: p2p
    text: "已成功执行的 hook 不会被迟到旧任务回滚，失败原因仍可观察并可重试。"
  - id: 7
    type: p2p
    text: "CSR 续期、ARI 窗口、归档、手工保存和未到期证书的原有行为保持通过。"
